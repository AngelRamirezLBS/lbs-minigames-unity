name: wild-whiz-provenance

on:
  push:
    paths:
      - "Assets/App/Games/WildWhiz/**"
      - "docs/asset-provenance/wild-whiz.md"
      - "Assets/App/Games/WildWhiz/Editor/WildWhizMissionChecks.cs"
      - ".github/workflows/wild-whiz-provenance.yml"
  pull_request:
    paths:
      - "Assets/App/Games/WildWhiz/**"
      - "docs/asset-provenance/wild-whiz.md"
      - "Assets/App/Games/WildWhiz/Editor/WildWhizMissionChecks.cs"

jobs:
  provenance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify WildWhiz provenance ledger (SHA-256 gate)
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re
          import sys

          ledger = Path("docs/asset-provenance/wild-whiz.md")
          roots = tuple(Path(p) for p in (
              "Assets/App/Games/WildWhiz/Art",
              "Assets/App/Games/WildWhiz/Audio",
              "Assets/App/Games/WildWhiz/Data",
          ))
          digest = re.compile(r"^[0-9a-fA-F]{64}$")
          entries = {}
          in_table = False
          for number, raw in enumerate(ledger.read_text(encoding="utf-8").splitlines(), 1):
              line = raw.strip()
              if not line.startswith("|"):
                  continue
              columns = [part.strip() for part in line.strip("|").split("|")]
              if columns[:2] == ["Path", "SHA-256"] or all(set(c) <= set("-:") for c in columns):
                  in_table = True
                  continue
              if not in_table or len(columns) < 3:
                  raise SystemExit(f"FAIL: malformed ledger row {number}")
              path, expected = columns[0], columns[1]
              if not any(Path(path).is_relative_to(root) for root in roots):
                  raise SystemExit(f"FAIL: out-of-scope ledger path at row {number}: {path}")
              if not digest.fullmatch(expected):
                  raise SystemExit(f"FAIL: malformed SHA-256 at row {number}: {path}")
              if path in entries:
                  raise SystemExit(f"FAIL: duplicate ledger path at row {number}: {path}")
              entries[path] = expected.lower()

          actual_files = {
              path.as_posix()
              for root in roots if root.exists()
              for path in root.rglob("*")
              if path.is_file() and path.suffix != ".meta"
          }
          if set(entries) != actual_files:
              missing = sorted(actual_files - set(entries))
              extra = sorted(set(entries) - actual_files)
              if missing:
                  print("FAIL: unlisted files:", *missing, sep="\n  ")
              if extra:
                  print("FAIL: ledger entries without files:", *extra, sep="\n  ")
              sys.exit(1)
          for path, expected in sorted(entries.items()):
              actual = sha256(Path(path).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"FAIL: SHA mismatch {path} expected {expected} got {actual}")
          print(f"Provenance gate: PASS ({len(entries)} Wild Whiz rows/assets)")
          PY
